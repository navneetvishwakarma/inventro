<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:16px;font-family:var(--font-sans)"></div>
<script type="text/babel">
const { Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter, Table, ListRow, Badge, Button } = window.InventroDesignSystem_2cd99f;
function Demo(){
  return (<div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:640}}>
    <Card>
      <CardHeader><CardTitle>Inventory</CardTitle><CardDescription>42 items tracked.</CardDescription></CardHeader>
      <CardContent>
        <ListRow title="Basmati rice (India Gate)" subtitle="1.5kg ≈ 3 packs" meta={['3 days left','last bought Jul 24']} trailing={<Badge tone="gold">Running low</Badge>} />
        <ListRow title="Toor dal" subtitle="0kg" meta={['out of stock']} trailing={<Badge tone="error">Out of stock</Badge>} />
      </CardContent>
      <CardFooter><Button size="sm" variant="ghost">View all</Button></CardFooter>
    </Card>
    <Table columns={[{key:'name',header:'Item'},{key:'spend',header:'Spend',numeric:true,align:'right',render:r=>`₹${r.spend.toFixed(2)}`}]} rows={[{id:1,name:'Basmati rice',spend:640},{id:2,name:'Toor dal',spend:186}]} />
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
