<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inventro &middot; Catalog manager &mdash; High-fidelity</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- @screen id="catalog" name="Catalog manager" subtitle="Merge, recategorize, archive" -->
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  body{margin:0;background:var(--color-surface-sunken);}
  #root{padding:var(--space-8) var(--space-6);font-family:var(--font-sans);}
  .screens-row{display:flex;gap:var(--space-8);align-items:flex-start;flex-wrap:wrap;}
  .page-head{max-width:1180px;margin:0 auto var(--space-6);display:flex;flex-direction:column;gap:var(--space-2);}
  .page-head h2{font:var(--text-h2);letter-spacing:var(--ls-h2);color:var(--color-foreground);margin:0;}
  .page-head p{font:var(--text-body-sm);color:var(--color-foreground-muted);margin:0;max-width:760px;}
  .back-link{font:600 13px/1 var(--font-sans);color:var(--color-link);text-decoration:none;}
  .center-wrap{max-width:1180px;margin:0 auto;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Sidebar, Card, CardHeader, CardTitle, CardDescription, CardContent, Checkbox, Button, Badge, Select, Radio, Input } = window.InventroDesignSystem_2cd99f;

  // --- Composed from tokens only -- NOT first-class design-system
  // components. See CHANGELOG "Components with no design-system match".
  function Sparkline({ points, tone = 'var(--color-foreground-subtle)', width = 76, height = 24 }) {
    const min = Math.min(...points), max = Math.max(...points), range = (max - min) || 1;
    const step = width / (points.length - 1);
    const d = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${(i * step).toFixed(1)},${(height - ((p - min) / range) * height).toFixed(1)}`).join(' ');
    return (<svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} role="img" aria-label="Price trend"><path d={d} fill="none" stroke={tone} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>);
  }
  function StepDots({ step, total = 3 }) {
    return (<div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-2)', justifyContent: 'center' }}>
      {Array.from({ length: total }).map((_, i) => (
        <React.Fragment key={i}>
          <span style={{
            width: 24, height: 24, borderRadius: 'var(--radius-full)', display: 'flex', alignItems: 'center', justifyContent: 'center', font: '600 12px/1 var(--font-sans)',
            background: i + 1 === step ? 'var(--color-primary)' : i + 1 < step ? 'var(--color-primary-subtle)' : 'var(--color-surface-sunken)',
            color: i + 1 === step ? 'var(--color-primary-foreground)' : i + 1 < step ? 'var(--color-primary-subtle-foreground)' : 'var(--color-foreground-subtle)',
          }}>{i + 1}</span>
          {i < total - 1 && <span style={{ width: 30, height: 1.5, background: 'var(--color-border-strong)' }} />}
        </React.Fragment>
      ))}
    </div>);
  }
  function ProgressBar({ value, max, tone = 'var(--color-primary)' }) {
    const pct = Math.max(0, Math.min(100, Math.round((value / max) * 100)));
    return (<div style={{ height: 8, borderRadius: 'var(--radius-full)', background: 'var(--color-surface-sunken)', overflow: 'hidden' }}>
      <div style={{ width: pct + '%', height: '100%', background: tone, borderRadius: 'var(--radius-full)' }} />
    </div>);
  }
  function ImagePreview({ label, height = 220 }) {
    return (<div style={{
      height, borderRadius: 'var(--radius-md)', border: '1px solid var(--color-border)', background: 'var(--color-surface-sunken)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: 'var(--space-4)',
      font: 'var(--text-caption)', color: 'var(--color-foreground-subtle)',
    }}>{label}</div>);
  }
  function Dropzone({ children, dragging }) {
    return (<div style={{
      border: `1.5px dashed ${dragging ? 'var(--color-primary)' : 'var(--color-border-strong)'}`, borderRadius: 'var(--radius-lg)',
      padding: 'var(--space-5)', background: dragging ? 'var(--color-primary-subtle)' : 'var(--color-surface-sunken)',
    }}>{children}</div>);
  }
  function Frame({ label, width, children }) {
    return (<div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-2)', minWidth: 0 }}>
      <div style={{ font: 'var(--text-overline)', textTransform: 'uppercase', letterSpacing: 'var(--ls-overline)', color: 'var(--color-foreground-subtle)' }}>{label}</div>
      <div style={{ width, maxWidth: '100%', background: 'var(--color-background)', border: '1px solid var(--color-border)', borderRadius: 'var(--radius-xl)', boxShadow: 'var(--shadow-md)', overflow: 'hidden' }}>{children}</div>
    </div>);
  }
  function ScreenTitle({ children, description }) {
    return (<div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-1)' }}>
      <h1 style={{ font: 'var(--text-h3)', letterSpacing: 'var(--ls-h3)', color: 'var(--color-foreground)', margin: 0 }}>{children}</h1>
      {description && <p style={{ font: 'var(--text-body-sm)', color: 'var(--color-foreground-muted)', margin: 0 }}>{description}</p>}
    </div>);
  }
  function MobileTopBar({ title, back }) {
    return (<div style={{ height: 48, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 'var(--space-2)', padding: '0 var(--space-4)', borderBottom: '1px solid var(--color-border)', background: 'var(--color-surface)' }}>
      <span style={{ font: '600 13px/1 var(--font-sans)', color: 'var(--color-foreground-muted)' }}>{back ? '\u2190' : '\u2261'}</span>
      <span style={{ font: 'var(--text-h6)', color: 'var(--color-foreground)' }}>{title}</span>
    </div>);
  }

const SIDEBAR_ITEMS = [
    { key: 'today', label: 'Today' },
    { key: 'add', label: 'Add' },
    { key: 'review', label: 'Review', count: 4 },
    { key: 'inventory', label: 'Inventory' },
    { key: 'plan', label: 'Plan' },
    { key: 'shopping-list', label: 'Shopping list' },
    { key: 'insights', label: 'Insights' },
    { key: 'catalog', label: 'Catalog' },
    { key: 'settings', label: 'Settings' },
  ];
const TABBAR_ITEMS = [
    { key: 'today', label: 'Today' },
    { key: 'inventory', label: 'Inventory' },
    { key: 'add', label: 'Add' },
    { key: 'shop', label: 'Shop' },
    { key: 'more', label: 'More' },
  ];

function ItemRow({ mobile }) {
  return (
    <div style={{ border: '1px solid var(--color-border)', borderRadius: 'var(--radius-md)', padding: 'var(--space-3)', display: 'flex', flexDirection: 'column', gap: 'var(--space-2)' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 'var(--space-2)' }}>
        <Checkbox id="ci1" label="Amul toned milk 1L (Amul)" checked={true} onChange={() => {}} />
        <Button variant="ghost" size="sm">Archive</Button>
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 'var(--space-2)' }}>
        <Badge tone="neutral">Dairy</Badge><Badge tone="neutral">3 aliases</Badge><Badge tone="success">Staple</Badge>
      </div>
      <div style={{ width: mobile ? '100%' : 220 }}><Select placeholder="Recategorize&hellip;" options={[{ value: 'dairy', label: 'Dairy' }]} /></div>
    </div>
  );
}
function MergePreview() {
  return (<Card>
    <CardHeader><CardTitle>Merge these two items?</CardTitle><CardDescription>Pick which one survives &mdash; the other is archived and its history moves to the survivor.</CardDescription></CardHeader>
    <CardContent>
      <Radio name="survivor" id="ra" label="Amul toned milk 1L (Amul) survives" checked={true} onChange={() => {}} />
      <Radio name="survivor" id="rb" label="AMUL MILK TONED 1 LTR survives" checked={false} onChange={() => {}} />
      <p style={{ font: 'var(--text-body-sm)', color: 'var(--color-foreground-muted)', margin: 0 }}>Combine 14 purchases and 2 aliases into one item.</p>
      <div style={{ display: 'flex', gap: 'var(--space-2)' }}><Button variant="primary" size="sm">Confirm merge</Button><Button variant="outline" size="sm">Cancel</Button></div>
    </CardContent>
  </Card>);
}
function Toolbar({ mobile }) {
  return (<Card><CardHeader><CardTitle>Catalog manager</CardTitle><CardDescription>Merge duplicates, fix categories, archive items you no longer buy.</CardDescription></CardHeader>
    <CardContent>
      <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'flex-end', gap: 'var(--space-2)' }}>
        <div style={{ width: mobile ? '100%' : 260 }}><Input placeholder="Search catalog&hellip;" size="sm" /></div>
        <Checkbox id="showArch" label="Show archived" checked={false} onChange={() => {}} />
        {!mobile && <Button variant="primary" size="sm">Merge selected</Button>}
      </div>
    </CardContent>
  </Card>);
}
function Demo(){
  return (<div>
    <div className="page-head">
      <a className="back-link" href="index.html">&larr; All screens</a>
      <h2>Catalog manager</h2>
      <p>Fallback for when automatic canonicalization gets it wrong: merge duplicates, recategorize, archive.</p>
    </div>
    <div className="screens-row">
      <Frame label="Web &middot; 1280px viewport" width={1100}>
        <div style={{ display: 'flex', minHeight: 700 }}>
          <Sidebar active="catalog" items={SIDEBAR_ITEMS} householdName="The Sharmas" />
          <div style={{ flex: 1, minWidth: 0, padding: 'var(--space-6)', display: 'flex', justifyContent: 'center', background: 'var(--color-background)' }}>
            <div style={{ width: 620, display: 'flex', flexDirection: 'column', gap: 'var(--space-4)' }}>
              <Toolbar mobile={false} /><MergePreview /><ItemRow mobile={false} /><ItemRow mobile={false} />
            </div>
          </div>
        </div>
      </Frame>
      <Frame label="Mobile &middot; 375px viewport &middot; sticky merge bar" width={375}>
        <div style={{ display: 'flex', flexDirection: 'column', minHeight: 780 }}>
          <MobileTopBar title="Catalog manager" />
          <div style={{ flex: 1, padding: 'var(--space-4)', display: 'flex', flexDirection: 'column', gap: 'var(--space-3)', background: 'var(--color-background)', overflowY: 'auto' }}>
            <Toolbar mobile={true} /><MergePreview /><ItemRow mobile={true} /><ItemRow mobile={true} />
          </div>
          <div style={{ padding: 'var(--space-3) var(--space-4)', borderTop: '1px solid var(--color-border)', background: 'var(--color-surface)' }}>
            <Button variant="primary" size="lg">Merge selected</Button>
          </div>
        </div>
      </Frame>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
